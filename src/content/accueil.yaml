titre: Votre boucherie de quartier à Romainville
sousTitre: >-
  Viandes d’élevage choisis, produits de charcuterie faits maison, poulets
  rôtis… et des conseils sur mesure. 

  La Boucherie Villenière est au service des gourmands de Romainville.
image: /images/accueil/image.jpeg
engagements:
  - titre: Des élevages choisis
    texte: >-
      Nous privilégions l’élevage en plein air et travaillons avec des
      producteurs que nous connaissons. Porc du Cantal ou Bio de l'ouest de la
      France, Boeuf du Limousin, Volaille des Landes,...
  - titre: Produits de charcuterie faits maison
    texte: >-
      Saucisses, farces, pâtés et plats cuisinés sont préparés chaque jour dans
      notre atelier. 

      Les produits de charcuterie et nos saucisses sont fabriqués à partir des
      viandes de nos éleveurs. Saucisses, pâtés, boudin noir ou boudin blanc :
      tout est fabriqué sur place et conservé comme autrefois, au sel de
      Guérande. Nous mettons un point d'honneur à ne pas utiliser de nitrites
      dans nos fabrications maison. 
  - titre: Le conseil du boucher
    texte: >-
      Une découpe sur mesure, une cuisson à réussir ? Notre équipe de
      boucher.ère est là pour vous conseiller sur le choix de la viande qui sera
      la plus adaptée à votre recette. Demandez nous, nous sommes là pour vous. 
sections:
  - titre: La rôtissoire tourne
    texte: >-
      Poulets fermiers, grenailles dorées au jus, gratin dauphinois maison… Nos
      plats du jour sont à réserver en ligne et à retirer en boutique, sans
      attendre.


      Texte provisoire, à remplacer par celui de la boucherie.
