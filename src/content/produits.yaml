titre: Le conseil du boucher
chapo: >-
  Des viandes sélectionnées auprès d’élevages que nous connaissons, et le
  conseil du boucher pour bien les cuisiner.
questionViande: Qu'est-ce qu'on mange aujourd'hui ?
questionCuisson: Et comment allez-vous le cuire ?
messageFin: >-
  Vous hésitez ? Passez nous voir ou appelez-nous : on vous conseille et on vous
  prépare la pièce à la bonne taille.
